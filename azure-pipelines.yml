# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more: https://aka.ms/yaml
 
trigger:
  branches:
    include:
    - pipe
 
pool:
  vmImage: windows-latest
 
variables:
  - group: "velopack publish"
 
steps:
  - checkout: self
    path: s
    fetchDepth: 1  # Shallow fetch only the last commit
    clean: true
 
  - powershell: |
      $version = 1.0.17
      echo "##vso[task.setvariable variable=version]$version"
    displayName: 'Get Version from Project File'
 
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '8.0.x'
    displayName: 'Install .NET'
 
  - script: |
      dotnet publish MKproject/MKproject.csproj -c Release -o $(Build.ArtifactStagingDirectory)/Publish/win-x64 -r win-x64 --self-contained true
    displayName: 'Publish Application'
 
 
  - script: |
      dotnet tool install --global vpk
      vpk download s3  --bucket fox-global --channel win-x64 --endpoint http://198.7.119.42:9000 --keyId M7vOlSs7PznsJwiuGVyE --secret RwPBh65YQ3vi7mFNleszDzLCDe2aP3LSO4RS2Vdm
      vpk pack -u MKproject --channel win-x64 -v 1.0.17 -p $(Build.ArtifactStagingDirectory)/Publish/win-x64 -e MKproject.exe --packTitle "Fox" --icon $(Build.ArtifactStagingDirectory)/images/foxlogo.ico --splashImage $(Build.ArtifactStagingDirectory)/images/foxlogo.ico 
      vpk upload s3 --bucket fox-global --channel win-x64 --endpoint $(minio-upload-url) --keyId M7vOlSs7PznsJwiuGVyE --secret RwPBh65YQ3vi7mFNleszDzLCDe2aP3LSO4RS2Vdm 
    displayName: 'Create and Upload Velopack Release'
    env:
      PATH: $(PATH);$(USERPROFILE)\.dotnet\tools
 