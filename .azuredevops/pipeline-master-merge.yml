trigger:
  - master

pool:
  vmImage: ubuntu-latest

jobs:
- job: MergemasterIntoBranches
  displayName: 'Merge master into Custom Branches'
  steps:
  - checkout: self
    persistCredentials: true

  - script: |
      # Checkout master and update it
      git checkout master
      git pull origin master

      # Function to handle branch merging
      function merge_branch {
        local branch=$1
        # Check if branch exists on the remote
        if git rev-parse --verify --quiet origin/$branch; then
          git checkout -b $branch origin/$branch
        else
          echo "Branch $branch does not exist, creating it from master."
          git checkout -b $branch master
        fi
        git merge master --no-ff -m "Merging changes from master into $branch"
        git push origin $branch
      }

      # Merge master into each branch
      merge_branch "global"
      merge_branch "elk"
      merge_branch "soft"
    displayName: 'Fetch master and Merge into Branches'
