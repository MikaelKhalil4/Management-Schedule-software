trigger:
  - master

pool:
  vmImage: ubuntu-latest

jobs:
- job: MergemasterIntoBranches
  displayName: 'Merge master into Custom Branches'
  steps:
  - checkout: self
    persistCredentials: true

  - script: |
      git config --global user.email "mikaelkhalil7.mk@gmail.com"
      git config --global user.name "Azure DevOps pipeline"
      git checkout master
      git pull origin master
    
      git fetch -a     
      git checkout elk  
      git merge --allow-unrelated-histories origin/master --no-ff -m "Merging changes from master into $branch"
      git push origin elk
    displayName: 'Fetch master and Merge into Branches'
